<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>สั่งซื้อสินค้า</h1>
        <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันออเดอร์และแจ้งวิธีชำระเงิน</p>
      </div>

      <form id="orderForm" class="form">
        <div>
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div>
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>

        <div>
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>

        <div>
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" inputmode="numeric" required>
        </div>

        <div>
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือจำนวนที่ต้องการ"></textarea>
        </div>

        <button type="submit" class="btn btn--accent">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© Body Scent</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
